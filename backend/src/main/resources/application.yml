server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/prephub?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
#prephub:
#  cors:
#    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
#  import:
#    allowed-extensions: csv

prephub:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      temperature: 0.4
