server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/prephub?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

prephub:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      temperature: 0.3
  dedup:
    semantic-enabled: ${DEDUP_SEMANTIC_ENABLED:true}
    likely-threshold: ${DEDUP_LIKELY_THRESHOLD:0.90}
    possible-threshold: ${DEDUP_POSSIBLE_THRESHOLD:0.82}
    index-interval-ms: 30000
    index-initial-delay-ms: 5000